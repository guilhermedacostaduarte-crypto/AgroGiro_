<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Detalhes da Máquina - AgroGiro</title>
    <link rel="icon" href="imagens/logo.png.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --green: #2d6a4f;
            --green-dark: #1b4332;
            --gold: #d4a017;
            --bg: #f8faf9;
            --text: #1f2937;
            --muted: #6b7280;
            --whatsapp: #25D366;
            --whatsapp-dark: #1ebe5b;
            --white: #fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Cabeçalho */
        header { background: var(--white); box-shadow: 0 1px 0 rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100; padding: 12px 0; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--green), var(--green-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.3rem; }
        .logo-text h1 { font-size: 1.4rem; color: var(--green-dark); line-height: 1.1; }
        .logo-text small { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
        
        .btn-voltar { color: var(--green-dark); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; transition: 0.2s; }
        .btn-voltar:hover { color: var(--green); }

        .produto-container { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px 0; align-items: flex-start; }
        .col-galeria { flex: 1.5; min-width: 300px; width: 100%; }
        .col-detalhes { flex: 1; min-width: 300px; width: 100%; position: sticky; top: 90px; }
        
        /* GALERIA COM ALTURA TRAVADA E SETAS */
        .galeria-principal { width: 100%; height: 450px; background: #eef2f0; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #e5e7eb; position: relative; }
        .galeria-principal img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
        
        .galeria-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(255,255,255,0.92); color: var(--green-dark); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: 0.2s; z-index: 2; opacity: 0; }
        .galeria-principal:hover .galeria-btn { opacity: 1; }
        .galeria-btn:hover { background: #fff; transform: translateY(-50%) scale(1.05); }
        .galeria-btn.prev { left: 10px; }
        .galeria-btn.next { right: 10px; }
        
        .galeria-thumbs { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .galeria-thumbs::-webkit-scrollbar { height: 6px; }
        .galeria-thumbs::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .thumb { flex: 0 0 90px; height: 70px; background: #fff; border-radius: 8px; cursor: pointer; object-fit: contain; opacity: 0.5; transition: 0.2s; border: 2px solid #e5e7eb; padding: 4px; }
        .thumb:hover, .thumb.ativo { opacity: 1; border-color: var(--green); }

        .detalhes-header h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); color: var(--green-dark); margin-bottom: 12px; line-height: 1.2; }
        .preco-box { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; color: var(--gold); margin-bottom: 24px; }
        
        .especificacoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .espec { background: var(--white); padding: 16px; border-radius: 10px; border: 1px solid #e5e7eb; }
        .espec small { display: block; color: #6b7280; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
        .espec strong { font-size: 1.05rem; color: var(--text); word-break: break-word; }

        .contato-box { background: var(--white); padding: 24px; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .contato-box h3 { margin-bottom: 16px; color: var(--green-dark); font-size: 1.1rem; text-align: center; }
        
        .btn-whats { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; background: var(--whatsapp); color: #fff; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; margin-bottom: 24px; transition: 0.2s; text-align: center; }
        .btn-whats:hover { background: var(--whatsapp-dark); transform: translateY(-2px); }
        
        .vendedor-info { display: flex; flex-direction: column; gap: 12px; color: #4b5563; font-size: 0.95rem; background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #f3f4f6; }
        .vendedor-info p { display: flex; align-items: center; gap: 12px; margin: 0; }
        .vendedor-info i { color: var(--green); font-size: 1.1rem; width: 20px; text-align: center; }

        @media (max-width: 900px) {
            .produto-container { flex-direction: column; gap: 24px; padding: 24px 0; }
            .col-detalhes { position: static; }
            .galeria-principal { height: 350px; }
            .galeria-btn { opacity: 1; width: 36px; height: 36px; }
        }
        
        @media (max-width: 480px) {
            header { padding: 12px 0; }
            .galeria-principal { height: 260px; } /* Altura exata para o mobile */
            .especificacoes { grid-template-columns: 1fr; gap: 8px; }
            .contato-box { padding: 20px 16px; }
            .thumb { flex: 0 0 70px; height: 55px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-tractor"></i></div>
            <div class="logo-text">
                <h1>AgroGiro</h1>
                <small>Máquinas agrícolas de confiança</small>
            </div>
        </a>
        <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>
</header>

<div class="container produto-container" id="conteudoProduto">
    <div style="width: 100%; text-align: center; padding: 60px 0;">
        <h2 style="color: var(--green-dark);">Carregando máquina...</h2>
    </div>
</div>

<script src="dados.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const produtoId = parseInt(urlParams.get('id'));
    const maquina = maquinas.find(m => m.id === produtoId);
    const container = document.getElementById('conteudoProduto');
    
    let imagemAtualIndex = 0; 
    let imagensGaleria = []; 

    function urlImagemLocal(src) {
        if (!src) return '';
        if (src.startsWith('http')) return src;
        return src;
    }

    if (!maquina) {
        container.innerHTML = `
            <div style="width: 100%; text-align: center; padding: 60px 20px;">
                <h2 style="color: var(--gold-dark); margin-bottom: 20px;">Máquina não encontrada ou já vendida.</h2>
                <a href="index.html" class="btn-voltar" style="display: inline-block;">Voltar ao Catálogo</a>
            </div>
        `;
    } else {
        imagensGaleria = maquina.imagens && maquina.imagens.length > 0 ? maquina.imagens.map(urlImagemLocal) : [];
        let htmlImagens = '';
        let htmlThumbs = '';
        
        if(imagensGaleria.length > 0) {
            htmlImagens = `
                <button class="galeria-btn prev" onclick="navegarGaleria(-1)"><i class="fas fa-chevron-left"></i></button>
                <img src="${imagensGaleria[0]}" id="imgPrincipal" alt="${maquina.nome}" onerror="this.src='https://via.placeholder.com/800x600/eef2f0/1b4332?text=Foto+Indisponivel'">
                <button class="galeria-btn next" onclick="navegarGaleria(1)"><i class="fas fa-chevron-right"></i></button>
            `;
            
            imagensGaleria.forEach((img, index) => {
                let ativo = index === 0 ? 'ativo' : '';
                htmlThumbs += `<img src="${img}" class="thumb ${ativo}" id="thumb-${index}" onclick="mudarImagem(${index})" onerror="this.style.display='none'">`;
            });
        } else {
            htmlImagens = `<div style="padding:40px; color:#999; text-align:center;">Sem fotos disponíveis</div>`;
        }

        let telVendedor = maquina.vendedor ? maquina.vendedor.telefone : '5516997854876';
        let telLimpo = telVendedor.replace(/\D/g, ''); 
        if (!telLimpo.startsWith('55')) telLimpo = '55' + telLimpo;
        
        let linkWhatsComprar = `https://wa.me/${telLimpo}?text=` + encodeURIComponent(`Olá! Tenho interesse na máquina (ID: ${maquina.id}) ${maquina.nome} por R$ ${maquina.preco.toLocaleString('pt-BR')}. Pode me dar mais detalhes?`);

        container.innerHTML = `
            <div class="col-galeria">
                <div class="galeria-principal">
                    ${htmlImagens}
                </div>
                <div class="galeria-thumbs" id="thumbsContainer">
                    ${htmlThumbs}
                </div>
            </div>
            
            <div class="col-detalhes">
                <div class="detalhes-header">
                    <h2>${maquina.nome}</h2>
                    <div class="preco-box">R$ ${maquina.preco.toLocaleString('pt-BR')}</div>
                </div>
                
                <div class="especificacoes">
                    <div class="espec"><small>Marca</small><strong>${maquina.marca}</strong></div>
                    <div class="espec"><small>Ano</small><strong>${maquina.ano}</strong></div>
                    <div class="espec"><small>Horas / Estado</small><strong>${maquina.horas ? maquina.horas + 'h' : 'Consulte'}</strong></div>
                    <div class="espec"><small>Local / Região</small><strong>${maquina.local ? maquina.local.replace('Região de ', '') : 'Consulte'}</strong></div>
                </div>

                <div class="contato-box">
                    <h3>Gostou desta máquina?</h3>
                    <a href="${linkWhatsComprar}" class="btn-whats" target="_blank">
                        <i class="fab fa-whatsapp"></i> Falar sobre esta máquina
                    </a>
                    
                    <div class="vendedor-info">
                        <p><i class="fas fa-phone-alt"></i> ${telVendedor}</p>
                        <p><i class="fas fa-envelope"></i> ${maquina.vendedor ? maquina.vendedor.email : 'contato.agrogiro@gmail.com'}</p>
                    </div>
                </div>
            </div>
        `;
    }

    function mudarImagem(index) {
        if(index < 0 || index >= imagensGaleria.length) return;
        imagemAtualIndex = index;
        
        let imgPrincipal = document.getElementById('imgPrincipal');
        if(imgPrincipal) {
            imgPrincipal.src = imagensGaleria[index];
            
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('ativo'));
            let thumbAtivo = document.getElementById(`thumb-${index}`);
            if(thumbAtivo) {
                thumbAtivo.classList.add('ativo');
                thumbAtivo.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    }
    
    function navegarGaleria(direcao) {
        let novoIndex = imagemAtualIndex + direcao;
        
        if (novoIndex >= imagensGaleria.length) novoIndex = 0;
        if (novoIndex < 0) novoIndex = imagensGaleria.length - 1;
        
        mudarImagem(novoIndex);
    }
</script>
</body>
</html>
